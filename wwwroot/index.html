<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microsoft Agents Demo</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="avatar-header">A</div>
        <div>
          <div class="header-title">AI Agent</div>
          <div class="header-sub" id="status-text">Ready</div>
        </div>
      </div>
      <div class="header-right">
        <button class="mode-toggle-btn" id="mode-toggle-btn" title="Switch mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
          Client Tools
        </button>
        <button class="new-chat-btn" id="new-chat-btn" title="Start a new conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <line x1="12" y1="8" x2="12" y2="14"></line>
            <line x1="9"  y1="11" x2="15" y2="11"></line>
          </svg>
          New Chat
        </button>
      </div>
    </header>

    <main class="messages" id="messages">
      <div class="message assistant">
        <div class="avatar">A</div>
        <div class="bubble">Hello! How can I help you today?</div>
      </div>
    </main>

    <footer class="input-area">
      <form class="input-form" id="form">
        <textarea
          class="input"
          id="input"
          placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
          rows="1"
          autocomplete="off"
        ></textarea>
        <button type="submit" class="send-btn" id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
